name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  catalog:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Validate catalog and tracked files
        run: python3 scripts/validate_catalog.py --check-tracked-files
      - name: Test catalog and checkpoint validation
        run: python3 -m unittest discover -s tests -v
      - name: Check whitespace
        run: git diff --check
